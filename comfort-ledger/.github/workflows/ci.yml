name: Comfort Ledger CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  beta-api-checks:
    name: Beta API Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comfort-ledger-beta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: comfort-ledger-beta/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Predeploy config check
        run: npm run predeploy:check
        env:
          NODE_ENV: production
          COMFORT_SESSION_SECRET: ci-session-secret

      - name: Run tests
        run: npm test
